<h2>Graph ({{ triples.len() }} triples)</h2>

  <form method="post" action="/download/rdfxml" class="download-form">
    <input type="hidden" name="query" value="{{ original }}">
    <button type="submit">Download as RDF/XML</button>
  </form>

  <table class="results">
    <thead><tr><th>Subject</th><th>Predicate</th><th>Object</th></tr></thead>
    <tbody>
      {% for t in triples %}
      <tr>
        <td>{{ t.subject }}</td>
        <td>{{ t.predicate }}</td>
        <td>{{ t.object }}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
